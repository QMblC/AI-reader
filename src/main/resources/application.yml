spring:
  application:
    name: ai-reader
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  rate-limit:
    # Global budget for this application instance, only for POST /api/v1/analyses.
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

springdoc:
  show-actuator: true
  paths-to-match:
    - /api/v1/analyses
    - /actuator/health
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

yandex:
  # true selects Yandex; false keeps the offline stub and does not require credentials.
  enabled: ${YANDEX_ENABLED:false}
  api-key: ${YANDEX_API_KEY:}
  folder-id: ${YANDEX_FOLDER_ID:}
  model-name: ${YANDEX_MODEL:yandexgpt-5.1}
  base-url: ${YANDEX_BASE_URL:https://ai.api.cloud.yandex.net}
  temperature: ${YANDEX_TEMPERATURE:0.2}
  max-tokens: ${YANDEX_MAX_TOKENS:1500}
  connect-timeout: ${YANDEX_CONNECT_TIMEOUT:5s}
  read-timeout: ${YANDEX_READ_TIMEOUT:60s}
