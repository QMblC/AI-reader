spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aireader}
    username: ${DATABASE_USERNAME:aireader}
    password: ${DATABASE_PASSWORD:aireader}
    hikari:
      maximum-pool-size: 4
  application:
    name: ai-reader
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  mobile-access:
    firebase-project-number: ${APP_CHECK_PROJECT_NUMBER:}
    firebase-app-ids: ${APP_CHECK_ALLOWED_APP_IDS:}
    access-ttl: ${GUEST_ACCESS_TTL:30m}
    session-ttl: ${GUEST_SESSION_TTL:30d}
    session-creations-per-minute: ${GUEST_SESSION_CREATIONS_PER_MINUTE:30}
    session-refreshes-per-minute: ${GUEST_SESSION_REFRESHES_PER_MINUTE:10}
    guest-analyses-per-day: ${GUEST_ANALYSES_PER_DAY:20}
    guest-illustrations-per-day: ${GUEST_ILLUSTRATIONS_PER_DAY:3}
    total-analyses-per-day: ${TOTAL_ANALYSES_PER_DAY:200}
    total-illustrations-per-day: ${TOTAL_ILLUSTRATIONS_PER_DAY:30}
  rate-limit:
    # Global budget for this instance, for both AI POST endpoints.
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

springdoc:
  show-actuator: true
  paths-to-match:
    - /api/v1/guest-sessions/**
    - /api/v1/analyses
    - /api/v1/illustrations/**
    - /actuator/health
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

yandex:
  # true selects Yandex; false keeps the offline stub and does not require credentials.
  enabled: ${YANDEX_ENABLED:false}
  api-key: ${YANDEX_API_KEY:}
  folder-id: ${YANDEX_FOLDER_ID:}
  model-name: ${YANDEX_MODEL:yandexgpt-5.1}
  base-url: ${YANDEX_BASE_URL:https://ai.api.cloud.yandex.net}
  temperature: ${YANDEX_TEMPERATURE:0.2}
  max-tokens: ${YANDEX_MAX_TOKENS:1500}
  connect-timeout: ${YANDEX_CONNECT_TIMEOUT:5s}
  read-timeout: ${YANDEX_READ_TIMEOUT:60s}

cache:
  ttl: ${CACHE_TTL:48h}
  cleanup-interval: ${CACHE_CLEANUP_INTERVAL:60s}

illustration:
  enabled: ${ILLUSTRATION_ENABLED:false}
  api-key: ${YANDEX_API_KEY:}
  folder-id: ${YANDEX_FOLDER_ID:}
  base-url: ${YANDEX_BASE_URL:https://ai.api.cloud.yandex.net}
  model: ${ILLUSTRATION_MODEL:aliceai-image-art-3.0}
  scene-model: ${ILLUSTRATION_SCENE_MODEL:yandexgpt-lite}
  directory: ${IMAGE_STORAGE_DIRECTORY:./data/images}
  timeout: ${ILLUSTRATION_TIMEOUT:120s}
  max-image-bytes: 10485760
