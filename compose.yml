services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aireader
      POSTGRES_USER: ${DATABASE_USERNAME:-aireader}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aireader}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d aireader"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
